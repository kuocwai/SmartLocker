name: SmartLocker FIX 05 - Database SLA Dashboard CI

on:
  push:
    branches:
      - main
      - fix/05-database-sla-dashboard
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    name: Regression / Node 20 / ${{ matrix.storage }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        storage: [json, sqlite]
    env:
      SMARTLOCKER_DB_MODE: ${{ matrix.storage }}
    steps:
      - name: Checkout the PR source
        uses: actions/checkout@v4

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies (including native SQLite)
        run: npm ci --include=optional

      - name: Verify SQLite native module actually opens a database
        if: matrix.storage == 'sqlite'
        run: |
          node -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); if (db.prepare('SELECT 1 AS ok').get().ok !== 1) process.exit(1); db.close();"

      - name: Check JavaScript syntax
        run: |
          node --check db.js
          node --check server.js
          node --check public/app.js
          node --check tests/fix05.test.js

      - name: Run FIX 01-03 and FIX 05 isolated regression tests
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap \
            tests/fix01.test.js \
            tests/fix02.test.js \
            tests/fix03.test.js \
            tests/fix03_remaining.test.js \
            tests/fix05.test.js | tee fix05-test-output.tap
          grep -Eq '^# tests 20$' fix05-test-output.tap
          grep -Eq '^# pass 20$' fix05-test-output.tap
          grep -Eq '^# fail 0$' fix05-test-output.tap
          grep -Eq '^# skipped 0$' fix05-test-output.tap
